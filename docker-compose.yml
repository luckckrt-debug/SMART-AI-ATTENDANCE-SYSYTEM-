version: '3.8'

services:
  smart-attendance-ai:
    build: .
    container_name: smart-attendance-system
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_RUN_PORT=5000
      - SECRET_KEY=smart-attendance-production-key-2026
      - MONGO_URI=mongodb://mongo:27017/
      - MONGO_DB_NAME=students
      - CONFIDENCE_THRESHOLD=0.85
      - FRAMES_FOR_ATTENDANCE=6
    volumes:
      - ./database:/app/database
      - ./static/datasets:/app/static/datasets
      - ./static/profiles:/app/static/profiles
      - ./people:/app/people
      - ./Model/versions:/app/Model/versions
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: smart-attendance-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
